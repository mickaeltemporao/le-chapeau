worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream pool of Streamlit workers
    upstream streamlit_workers {
        # ip_hash ensures sticky sessions for student connections
        ip_hash;
        server 127.0.0.1:8501;
        server 127.0.0.1:8502;
        server 127.0.0.1:8503;
        server 127.0.0.1:8504;
    }

    server {
        listen 80;
        server_name _;

        # Timeouts for Streamlit WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;

        location / {
            proxy_pass http://streamlit_workers;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamlit real-time buffering settings
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;

            add_header Cache-Control "no-cache";
        }
    }
}
