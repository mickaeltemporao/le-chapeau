[project]
name = "chapeau"
version = "0.1.0"
description = "Turnkey A/B testing platform for conversational AI agents and LLM interactions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.40.0",
    "watchdog>=5.0.0",
]

[project.scripts]
chapeau = "chapeau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chapeau"]
